<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MicroCaption &mdash; Streams</title>
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body>
<nav>
  <a href="/" class="nav-logo">MicroCaption</a>
  <a href="/dashboard" class="nav-link active">Streams</a>
  <a href="/queue" class="nav-link">Queue</a>
  <a href="/monitor" class="nav-link">Monitor</a>
  <a href="/config" class="nav-link">Config</a>
  <a href="/logs" class="nav-link">Logs</a>
  <span id="user-email" style="color:#333;font-size:.72em;padding:0 8px"></span>
  <a href="/logout" class="nav-link">Log out</a>
</nav>
<main>
  <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px">
    <h2>Active Streams</h2>
    <span id="stream-count" style="color:#333;font-size:.78em">— active</span>
  </div>
  <div id="sessions-grid-wrap">
    <div class="sessions-grid">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
  <h2 style="margin-top:24px">Add Stream</h2>
  <div class="card">
    <div class="source-tabs">
      <button type="button" class="source-tab active" data-src="url">URL</button>
      <button type="button" class="source-tab" data-src="sdi">SDI</button>
    </div>

    <form id="add-form" class="row">
      <input type="url" id="url-input" placeholder="YouTube, Twitch, peg.tv, or any yt-dlp URL…" required>
      <button id="add-btn" class="btn-primary" type="submit">&#9654;&nbsp;Caption</button>
    </form>

    <form id="sdi-form" class="row" style="display:none">
      <select id="sdi-input"><option value="">No DeckLink devices detected…</option></select>
      <button id="sdi-btn" class="btn-primary" type="submit">&#9654;&nbsp;Caption</button>
    </form>
    <div id="sdi-strip" class="sdi-strip" style="display:none"></div>
  </div>
  <p id="url-hint" class="hint" style="margin-top:8px">Audio extracted server-side via yt-dlp — no third-party APIs.</p>
  <p id="sdi-hint" class="hint" style="margin-top:8px;display:none">Embedded SDI audio from the Blackmagic DeckLink — requires Desktop Video driver.</p>
</main>
<script src="/js/config.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
