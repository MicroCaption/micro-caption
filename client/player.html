<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MicroCaption &mdash; Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #ddd; font-family: monospace; min-height: 100vh; padding: 14px; }
    #topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; font-size: 0.78em;
    }
    #topbar h1 { color: #555; letter-spacing: 0.12em; text-transform: uppercase; font-size: 1em; }
    #topbar a { color: #555; text-decoration: none; border: 1px solid #2a2a2a; padding: 5px 12px; border-radius: 4px; }
    #topbar a:hover { color: #aaa; border-color: #444; }
    #stop-btn, #jump-live-btn { background: none; border: 1px solid #5a2020; color: #844; font-family: monospace; font-size: 1em; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    #stop-btn:hover, #jump-live-btn:hover { border-color: #a44; color: #c66; }
    #jump-live-btn { border-color: #2a5a2a; color: #484; }
    #jump-live-btn:hover { border-color: #4a8a4a; color: #6a6; }
    #player-wrap {
      position: relative; width: 100%; max-width: 1280px; margin: 0 auto;
      background: #000; border-radius: 6px; overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,.7);
    }
    #player-wrap iframe { display: block; width: 100%; aspect-ratio: 16/9; border: none; }
    #caption-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 14px 18px 20px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      text-align: center; pointer-events: none; min-height: 6em;
      display: flex; flex-direction: column; justify-content: flex-end;
      align-items: center; gap: 6px;
    }
    .caption-line {
      display: inline-block; font-size: 1.45em; line-height: 1.35; color: #fff;
      text-shadow: 1px 1px 3px #000, -1px -1px 3px #000;
      background: rgba(0,0,0,.38); padding: 2px 10px; border-radius: 3px;
      transition: opacity 0.15s ease;
    }
    #footer {
      max-width: 1280px; margin: 10px auto 0; display: flex;
      justify-content: space-between; align-items: center;
      font-size: 0.72em; color: #333;
    }
    #status { display: inline-block; padding: 2px 8px; border-radius: 3px; }
    #status.live    { color: #4c4; }
    #status.waiting { color: #555; }
    #status.error   { color: #c44; }
    #footer a { color: #333; text-decoration: none; }
    #footer a:hover { color: #666; }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>MicroCaption &mdash; Live ASR</h1>
    <div style="display:flex;gap:8px" id="topbar-actions">
      <a href="/dashboard">&larr; Control room</a>
      <span id="mode-btn-wrap"></span>
      <button id="stop-btn" onclick="stopSession()">&#9632; Stop</button>
    </div>
  </div>
  <div id="player-wrap">
    <div id="player-container"></div>
    <div id="caption-bar"></div>
  </div>
  <div id="footer">
    <span id="status" class="waiting">Connecting&hellip;</span>
    <span id="webvtt-link"></span>
  </div>

  <script src="/js/config.js"></script>
  <script>
    // Parse query params
    const _params = new URLSearchParams(window.location.search);
    const SESSION_ID = _params.get('id') || '';
    const MODE = _params.get('mode') || 'live';

    if (!SESSION_ID) {
      document.body.innerHTML = '<p style="color:#555;padding:40px;font-family:monospace">No session ID — <a href="/dashboard" style="color:#3a9a4a">back to dashboard</a></p>';
    }

    document.getElementById('webvtt-link').innerHTML =
      `<a href="${API}/webvtt/${SESSION_ID}">Download WebVTT</a>`;

    // Set up mode button
    const modeBtnWrap = document.getElementById('mode-btn-wrap');
    if (MODE === 'replay') {
      modeBtnWrap.innerHTML = `<button id="jump-live-btn" onclick="jumpToLive()">&#9197;&nbsp;Jump to live</button>`;
    } else {
      modeBtnWrap.innerHTML = `<a href="/player?id=${SESSION_ID}&mode=replay">&#9198;&nbsp;From beginning</a>`;
    }

    // Build player iframe (resolved after fetching session info)
    async function buildPlayer() {
      try {
        const r = await fetch(API + '/api/sessions');
        const sessions = await r.json();
        const sess = sessions.find(s => s.id === SESSION_ID);
        const container = document.getElementById('player-container');
        if (!sess) {
          container.innerHTML = '<p style="color:#555;padding:40px;text-align:center">Session not found</p>';
          return;
        }
        if (sess.source_type === 'youtube' && sess.video_id) {
          container.innerHTML =
            `<iframe id="yt-iframe"
              src="https://www.youtube.com/embed/${sess.video_id}?autoplay=1&mute=0&enablejsapi=1"
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen></iframe>`;
          // Load YT IFrame API
          const tag = document.createElement('script');
          tag.src = 'https://www.youtube.com/iframe_api';
          document.head.appendChild(tag);
        } else {
          const safeSrc = sess.url.replace(/"/g, '%22');
          container.innerHTML =
            `<iframe id="source-iframe"
              src="${safeSrc}"
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen></iframe>`;
        }
      } catch(e) {
        document.getElementById('player-container').innerHTML =
          '<p style="color:#555;padding:40px;text-align:center">Failed to load session info</p>';
      }
    }
    buildPlayer();
  </script>
  <script src="/js/captions.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
