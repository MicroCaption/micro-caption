<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MicroCaption &mdash; Live</title>
  <link rel="stylesheet" href="/css/shared.css">
  <style>
    /* Player-specific layout only — buttons & base styles come from shared.css. */
    body { padding: 14px; }
    #topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    #topbar h1 { color: #555; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.8em; }
    #topbar-actions { display: flex; align-items: center; gap: 8px; }
    /* So the dynamically-swapped mode button is a direct flex item and lines up. */
    #mode-btn-wrap { display: contents; }
    #player-wrap {
      position: relative; width: 100%; max-width: 1280px; margin: 0 auto;
      background: #000; border-radius: 6px; overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,.7);
    }
    #player-wrap iframe { display: block; width: 100%; aspect-ratio: 16/9; border: none; }
    /* Fullscreen: wrapper fills the screen so the caption overlay rides along. */
    #player-wrap:fullscreen { width: 100vw; max-width: none; border-radius: 0;
      display: flex; align-items: center; justify-content: center; }
    #player-wrap:fullscreen iframe { width: 100vw; height: 100vh; aspect-ratio: auto; }
    #player-wrap:fullscreen #caption-bar { padding-bottom: 36px; }
    #player-wrap:fullscreen .caption-line { font-size: 2em; }
    /* On-video fullscreen button: revealed on hover, bottom-right where the
       native YouTube fullscreen button used to be. */
    #fs-overlay-btn {
      position: absolute; bottom: 8px; right: 8px; z-index: 6;
      width: 38px; height: 38px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.35); border: none; border-radius: 4px;
      color: #fff; font-size: 1.25em; cursor: pointer;
      opacity: 0; transition: opacity .18s; text-shadow: 0 1px 2px #000;
    }
    #player-wrap:hover #fs-overlay-btn,
    #player-wrap:focus-within #fs-overlay-btn { opacity: .9; }
    #fs-overlay-btn:hover { opacity: 1; background: rgba(0,0,0,.55); }
    #caption-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 14px 18px 20px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      text-align: center; pointer-events: none; min-height: 6em;
      display: flex; flex-direction: column; justify-content: flex-end;
      align-items: center; gap: 6px;
    }
    .caption-line {
      display: inline-block; font-size: 1.45em; line-height: 1.35; color: #fff;
      text-shadow: 1px 1px 3px #000, -1px -1px 3px #000;
      background: rgba(0,0,0,.38); padding: 2px 10px; border-radius: 3px;
      transition: opacity 0.15s ease;
    }
    #footer {
      max-width: 1280px; margin: 10px auto 0; display: flex;
      justify-content: space-between; align-items: center;
      font-size: 0.72em; color: #333;
    }
    #status { display: inline-block; padding: 2px 8px; border-radius: 3px; }
    #status.live    { color: #4c4; }
    #status.waiting { color: #555; }
    #status.error   { color: #c44; }
    #footer a { color: #333; text-decoration: none; }
    #footer a:hover { color: #666; }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>MicroCaption &mdash; Live ASR</h1>
    <div id="topbar-actions">
      <a href="/dashboard" class="btn-neutral">&larr; Control room</a>
      <span id="mode-btn-wrap"></span>
      <button id="fs-btn" class="btn-neutral" onclick="toggleFullscreen()">&#9974; Fullscreen</button>
      <button id="stop-btn" class="btn-danger" onclick="stopSession()">&#9632; Stop</button>
    </div>
  </div>
  <div id="player-wrap">
    <div id="player-container"></div>
    <div id="caption-bar"></div>
    <!-- On-video fullscreen control. YouTube's native one is disabled (fs=0)
         because it would hide the caption overlay; this sits in the same spot
         and fullscreens the whole wrapper so captions stay visible. -->
    <button id="fs-overlay-btn" onclick="toggleFullscreen()" title="Fullscreen" aria-label="Fullscreen">&#9974;</button>
  </div>
  <div id="footer">
    <span id="status" class="waiting">Connecting&hellip;</span>
    <span id="webvtt-link"></span>
  </div>

  <script src="/js/config.js"></script>
  <script>
    // Parse query params
    const _params = new URLSearchParams(window.location.search);
    const SESSION_ID = _params.get('id') || '';
    const MODE = _params.get('mode') || 'live';

    if (!SESSION_ID) {
      document.body.innerHTML = '<p style="color:#555;padding:40px;font-family:monospace">No session ID — <a href="/dashboard" style="color:#3a9a4a">back to dashboard</a></p>';
    }

    document.getElementById('webvtt-link').innerHTML =
      `<a href="${API}/webvtt/${SESSION_ID}">Download WebVTT</a>`;

    // Set up mode button
    const modeBtnWrap = document.getElementById('mode-btn-wrap');
    if (MODE === 'replay') {
      modeBtnWrap.innerHTML = `<button id="jump-live-btn" class="btn-watch" onclick="jumpToLive()">&#9197; Jump to live</button>`;
    } else {
      modeBtnWrap.innerHTML = `<a href="/player?id=${SESSION_ID}&mode=replay" class="btn-watch">&#9198; From beginning</a>`;
    }

    // Fullscreen the whole wrapper (iframe + caption overlay) rather than the
    // bare iframe, so captions stay visible in fullscreen.
    function toggleFullscreen() {
      const el = document.getElementById('player-wrap');
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('fs-btn');
      if (btn) btn.innerHTML = document.fullscreenElement
        ? '&#9974;&nbsp;Exit' : '&#9974;&nbsp;Fullscreen';
    });

    // Build player iframe (resolved after fetching session info)
    async function buildPlayer() {
      try {
        const r = await fetch(API + '/api/sessions');
        const sessions = await r.json();
        const sess = sessions.find(s => s.id === SESSION_ID);
        const container = document.getElementById('player-container');
        if (!sess) {
          container.innerHTML = '<p style="color:#555;padding:40px;text-align:center">Session not found</p>';
          return;
        }
        if (sess.source_type === 'youtube' && sess.video_id) {
          // fs=0 hides YouTube's native fullscreen button — it would fullscreen
          // only the iframe, hiding our caption overlay. We provide our own
          // fullscreen button (toggleFullscreen) that expands the whole wrapper.
          container.innerHTML =
            `<iframe id="yt-iframe"
              src="https://www.youtube.com/embed/${sess.video_id}?autoplay=1&mute=0&enablejsapi=1&fs=0"
              allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
          // Load YT IFrame API
          const tag = document.createElement('script');
          tag.src = 'https://www.youtube.com/iframe_api';
          document.head.appendChild(tag);
        } else {
          const safeSrc = sess.url.replace(/"/g, '%22');
          container.innerHTML =
            `<iframe id="source-iframe"
              src="${safeSrc}"
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen></iframe>`;
        }
      } catch(e) {
        document.getElementById('player-container').innerHTML =
          '<p style="color:#555;padding:40px;text-align:center">Failed to load session info</p>';
      }
    }
    buildPlayer();
  </script>
  <script src="/js/captions.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
