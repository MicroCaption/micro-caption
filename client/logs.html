<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MicroCaption &mdash; Logs</title>
  <link rel="stylesheet" href="/css/shared.css">
  <style>
    .logs-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
    @media (max-width: 820px) { .logs-layout { grid-template-columns: 1fr; } }

    /* ── stream list (left) ── */
    .stream-list { display: flex; flex-direction: column; gap: 8px; }
    .stream-item {
      background: #0f0f0f; border: 1px solid #1c1c1c; border-left: 3px solid #1c1c1c;
      border-radius: 5px; padding: 11px 13px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .stream-item:hover { background: #131313; }
    .stream-item.sel { background: #151515; border-color: #2a4a32; }
    .stream-item.live    { border-left-color: #3a9a4a; }
    .stream-item.ended   { border-left-color: #444; }
    .stream-item.error   { border-left-color: #7a2a2a; }
    .stream-item.starting{ border-left-color: #8a7a2a; }
    .si-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .si-title { color: #bbb; font-size: 0.82em; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; margin-right: auto; }
    .si-meta { color: #383838; font-size: 0.7em; display: flex; justify-content: space-between; }
    .acc-badge { font-size: 0.66em; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em;
      border: 1px solid #222; color: #666; white-space: nowrap; }
    .acc-good { color: #4caa5a; border-color: #1e4a2a; background: #0e2014; }
    .acc-mid  { color: #b59a3a; border-color: #4a3e16; background: #201c0e; }
    .acc-bad  { color: #c05a5a; border-color: #4a1e1e; background: #200e0e; }
    .acc-none { color: #444; }

    /* ── detail (right) ── */
    .detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .detail-url { color: #777; font-size: 0.8em; word-break: break-all; margin-right: auto; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    @media (max-width: 620px) { .summary-grid { grid-template-columns: 1fr 1fr; } }
    .cmp-ref  { color: #8aa88a; }
    .cmp-hyp  { color: #999; }
    .cmp-acc.acc-good { color: #4caa5a; }
    .cmp-acc.acc-mid  { color: #b59a3a; }
    .cmp-acc.acc-bad  { color: #c05a5a; }
    tr.row-bad td { background: #160d0d; }
    tr.row-mid td { background: #16140d; }
    .behind-note { color: #8a7a2a; font-size: 0.72em; margin-top: 8px; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">MicroCaption</a>
  <a href="/dashboard" class="nav-link">Streams</a>
  <a href="/queue" class="nav-link">Queue</a>
  <a href="/monitor" class="nav-link">Monitor</a>
  <a href="/config" class="nav-link">Config</a>
  <a href="/logs" class="nav-link active">Logs</a>
  <a href="/logout" class="nav-link">Log out</a>
</nav>
<main>
  <div class="logs-layout">
    <div>
      <h2>Streams</h2>
      <div class="stream-list" id="stream-list">
        <div class="stub" style="padding:10px">Loading…</div>
      </div>
    </div>
    <div>
      <h2>Accuracy &amp; caption log</h2>
      <div id="detail">
        <div class="empty-state">Select a stream to view its caption log and accuracy report.</div>
      </div>
    </div>
  </div>
</main>

<script src="/js/config.js"></script>
<script>
function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Accuracy (0..1 or null) → {pct, cls}
function accInfo(a){
  if (a == null) return { pct: '—', cls: 'acc-none' };
  const pct = (a * 100).toFixed(1) + '%';
  const cls = a >= 0.95 ? 'acc-good' : a >= 0.85 ? 'acc-mid' : 'acc-bad';
  return { pct, cls };
}
function streamTitle(s){ return s.video_id || s.url || s.id; }
function fmtClock(t){
  t = Math.max(0, Math.floor(t||0));
  const m = Math.floor(t/60), sec = t%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function fmtDate(epoch){
  if (!epoch) return '';
  try { return new Date(epoch*1000).toLocaleString(); } catch(e){ return ''; }
}

let selectedId = null;
let lastDetailStatus = null;

function renderList(sessions){
  const el = document.getElementById('stream-list');
  if (!sessions.length){
    el.innerHTML = '<div class="empty-state">No streams yet.</div>';
    return;
  }
  el.innerHTML = sessions.map(s => {
    const st = s.status || 'ended';
    const a = accInfo(s.accuracy);
    const sel = s.id === selectedId ? ' sel' : '';
    return `<div class="stream-item ${escH(st)}${sel}" data-id="${escH(s.id)}">
      <div class="si-top">
        <span class="dot dot-${escH(st)}"></span>
        <span class="si-title">${escH(streamTitle(s))}</span>
        <span class="acc-badge ${a.cls}">${a.pct}</span>
      </div>
      <div class="si-meta"><span>${escH(s.id)} · ${s.cue_count||0} cues</span><span>${escH(st)}</span></div>
    </div>`;
  }).join('');
  el.querySelectorAll('.stream-item').forEach(node => {
    node.addEventListener('click', () => selectStream(node.dataset.id));
  });
}

function selectStream(id){
  selectedId = id;
  lastDetailStatus = null;
  document.querySelectorAll('.stream-item').forEach(n =>
    n.classList.toggle('sel', n.dataset.id === id));
  loadDetail();
}

function renderDetail(d){
  const st = d.status || 'ended';
  const sum = d.accuracy_summary || {};
  const records = d.records || [];
  const a = accInfo(d.accuracy != null ? d.accuracy : sum.accuracy);

  const summaryCard = `
    <div class="card summary-grid">
      <div><div class="stat-label">Accuracy</div><div class="stat-val ${a.cls}">${a.pct}</div></div>
      <div><div class="stat-label">Segments</div><div class="stat-val">${sum.segment_count||0}</div></div>
      <div><div class="stat-label">Ref words</div><div class="stat-val">${sum.ref_words||0}</div></div>
      <div><div class="stat-label">S / D / I</div><div class="stat-val">${sum.substitutions||0} / ${sum.deletions||0} / ${sum.insertions||0}</div></div>
    </div>
    ${sum.skipped_segments ? `<div class="behind-note">⚠ verifier fell behind (GPU saturated) — ${sum.skipped_segments} segment(s) were not scored.</div>` : ''}`;

  let rows;
  if (!records.length){
    rows = `<tr><td colspan="4" class="stub">No verified segments yet${st==='live'?' — the accuracy pass runs a few seconds behind live.':'.'}</td></tr>`;
  } else {
    rows = records.slice().reverse().map(r => {
      const ra = accInfo(r.accuracy);
      const rowCls = r.accuracy >= 0.95 ? '' : (r.accuracy >= 0.85 ? 'row-mid' : 'row-bad');
      return `<tr class="${rowCls}">
        <td class="ts">${fmtClock(r.start)}–${fmtClock(r.end)}</td>
        <td class="cmp-ref">${escH(r.reference)}</td>
        <td class="cmp-hyp">${escH(r.hypothesis) || '<span class="stub">(missed)</span>'}</td>
        <td class="cmp-acc ${ra.cls}">${ra.pct}</td>
      </tr>`;
    }).join('');
  }

  const replay = `<a class="btn-watch" href="/player?id=${escH(d.id)}&mode=replay" target="_blank">&#9198; Caption log</a>`;
  const watch = st === 'live'
    ? `<a class="btn-watch" href="/player?id=${escH(d.id)}" target="_blank">&#9654; Watch live</a>` : '';

  document.getElementById('detail').innerHTML = `
    <div class="detail-head">
      <span class="dot dot-${escH(st)}"></span>
      <span class="detail-url">${escH(d.url || d.id)}</span>
      ${watch}${replay}
    </div>
    <p class="hint" style="margin-bottom:12px">Started ${escH(fmtDate(d.created_at))} · reference = high-accuracy second pass</p>
    ${summaryCard}
    <h2 style="margin-top:18px">Segment comparison · reference vs live</h2>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>Time</th><th>Reference (verifier)</th><th>Live captions</th><th>Acc</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  lastDetailStatus = st;
}

function loadDetail(){
  if (!selectedId) return;
  fetch(API + '/api/logs/session/' + encodeURIComponent(selectedId))
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(renderDetail)
    .catch(() => {
      document.getElementById('detail').innerHTML =
        '<div class="empty-state">Failed to load this stream\'s log.</div>';
    });
}

function refreshList(){
  return fetch(API + '/api/logs/sessions')
    .then(r => r.json())
    .then(sessions => {
      renderList(sessions);
      // Auto-select the newest stream on first load.
      if (selectedId == null && sessions.length){ selectStream(sessions[0].id); }
      return sessions;
    })
    .catch(() => {
      document.getElementById('stream-list').innerHTML =
        '<div class="empty-state">Failed to load.</div>';
    });
}

function tick(){
  refreshList();
  // Keep the open stream's detail fresh while it's live.
  if (selectedId && lastDetailStatus !== 'ended' && lastDetailStatus !== 'error'){
    loadDetail();
  }
}
refreshList();
setInterval(tick, 2000);
</script>
</body>
</html>
