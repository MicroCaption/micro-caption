<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MicroCaption &mdash; Logs</title>
  <link rel="stylesheet" href="/css/shared.css">
  <style>
    /* Heroic-style log manager: sources sidebar + viewer pane. */
    .logmgr { display: flex; height: calc(100vh - 46px); }
    .log-side {
      width: 280px; flex: 0 0 280px; border-right: 1px solid #181818;
      overflow-y: auto; padding: 10px 0;
    }
    .log-group-h {
      color: #3a3a3a; font-size: 0.66em; letter-spacing: 0.14em;
      text-transform: uppercase; padding: 12px 16px 5px;
    }
    .log-item {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 7px 16px; color: #888; font-size: 0.84em; border-left: 2px solid transparent;
    }
    .log-item:hover { background: #131313; color: #cfcfcf; }
    .log-item.active { background: #181818; color: #fff; border-left-color: #3a9a4a; }
    .log-item .li-main { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-item .li-sub { color: #444; font-size: 0.82em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }

    .log-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .log-head {
      display: flex; align-items: center; gap: 12px; padding: 12px 18px;
      border-bottom: 1px solid #181818;
    }
    .log-title { color: #ddd; font-size: 0.95em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-meta { color: #555; font-size: 0.74em; }
    .log-actions { display: flex; gap: 6px; align-items: center; }
    .log-body { flex: 1; overflow: auto; padding: 14px 18px; }
    pre.log-pre {
      margin: 0; white-space: pre-wrap; word-break: break-word;
      font-size: 0.78em; line-height: 1.55; color: #7a9a7a;
    }
    .cue-row { display: flex; gap: 12px; padding: 3px 0; font-size: 0.82em; line-height: 1.5; }
    .cue-t { color: #4a6a4a; flex: 0 0 64px; text-align: right; }
    .cue-spk { color: #6a6a9a; flex: 0 0 90px; }
    .cue-x { color: #cfcfcf; flex: 1; }
    .acc-bar { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #161616; }
    .toggle { color: #666; font-size: 0.78em; cursor: pointer; user-select: none; }
    .toggle.on { color: #3a9a4a; }
    .empty { color: #333; font-style: italic; padding: 24px; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">MicroCaption</a>
  <a href="/dashboard" class="nav-link">Streams</a>
  <a href="/queue" class="nav-link">Queue</a>
  <a href="/monitor" class="nav-link">Monitor</a>
  <a href="/config" class="nav-link">Config</a>
  <a href="/logs" class="nav-link active">Logs</a>
  <a href="/logout" class="nav-link">Log out</a>
</nav>
<div class="logmgr">
  <aside class="log-side" id="log-side">
    <div class="empty">Loading sources…</div>
  </aside>
  <section class="log-main">
    <div class="log-head">
      <div class="log-title" id="log-title">Select a log</div>
      <div class="log-meta" id="log-meta"></div>
      <div class="log-actions" id="log-actions"></div>
    </div>
    <div class="log-body" id="log-body">
      <div class="empty">Pick a source on the left — system logs, live streams, or stream history.</div>
    </div>
  </section>
</div>
<script src="/js/config.js"></script>
<script src="/js/logs.js"></script>
</body>
</html>
