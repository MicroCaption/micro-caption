# MicroCaption — CTA-708 Real-Time Captioning System
# Default configuration (test mode with ALSA/PulseAudio input)
#
# Override any value with an environment variable:
#   MC_IO_ADAPTER=decklink  MC_OUTPUT_WEBVTT_PORT=9000  python main.py
# Or point to a different config file:
#   MC_CONFIG=config/settings.prod.yaml  python main.py

mode: test   # test | production

# ── I/O adapter ──────────────────────────────────────────────────────────────
io:
  adapter: alsa   # alsa | decklink   (swap here, not in code)
  alsa:
    device: default   # PulseAudio source name; 'default' = system default mic
    # To list available devices:  pactl list sources short
    # Example:  device: alsa_input.pci-0000_00_1f.3.analog-stereo
  decklink:
    # Populated in Phase 2 when hardware is available
    device_index: 0
    input_connection: sdi   # sdi | hdmi | component

# ── ASR engine ───────────────────────────────────────────────────────────────
asr:
  primary: whisper    # parakeet | whisper  (switch back to parakeet once nemo_toolkit is installed)
  chunk_duration: 2.0   # streaming loop: VAD silence window only (no longer the inference window)
  step_duration: 0.7    # seconds of new audio between inference steps (lower = faster commits, more GPU)
  # Streaming (LocalAgreement-2) loop — active when the backend has word timestamps (Whisper):
  min_chunk_duration: 0.6    # min audio buffered before the first inference
  max_buffer_duration: 14.0  # hard cap; force-commit the tail if the buffer grows past this
  context_duration: 2.0      # seconds of committed audio kept as left-context after trimming
  # Accuracy-over-speed: hold the most recent N seconds back as look-ahead
  # context and re-review the tail before releasing it for display. Higher =
  # more accurate but more delay. 0 disables (fastest, less accurate).
  review_delay: 3.5
  max_latency_ms: 2000  # warn if inference exceeds this
  # Accuracy-first: audio is never dropped. This is a deep bounded queue so a
  # transient GPU stall waits rather than discarding audio; only sustained
  # saturation (many concurrent streams) ever fills it. ~minutes deep.
  audio_queue_max: 600
  vad_rms_threshold: 1.0e-4
  vad_hangover_frames: 2
  latency_window: 50    # rolling sample count for latency stats

  parakeet:
    model: nvidia/parakeet-tdt_ctc-0.6b
    device: cuda

  whisper:
    model: large-v3-turbo   # swap to base.en for faster first-run download (~145 MB vs 1.6 GB)
    device: cuda
    compute_type: float16   # float16 | int8 | int8_float16

  # ── Accuracy verifier (second, slower pass) ───────────────────────────────
  # A per-session pass that re-transcribes the same audio at high accuracy and
  # scores how closely the live captions matched it (WER → accuracy %). Runs
  # behind live; never drops audio. Results feed the per-stream Logs UI.
  verifier:
    enabled: true
    beam_size: 5            # thorough decode for the reference transcript (live path stays beam=1)
    settle_seconds: 5.0     # wait this long after a window before scoring, so the live path
                            # (which commits with review_delay look-ahead) has caught up first —
                            # otherwise correct-but-late captions score as false misses
    headline_seconds: 600.0 # the headline accuracy % aligns the whole reference vs the whole live
                            # transcript over this rolling span, so per-window boundary effects cancel
    segment_seconds: 8.0    # transcribe in windows of ~this length (or on a VAD silence boundary)
    min_segment_seconds: 4.0  # don't verify a window shorter than this unless an utterance ended
    max_backlog_seconds: 60.0 # if the verifier falls this far behind, note it instead of buffering more
    context_seconds: 1.0    # left-context kept after each verified window

# ── Accuracy / per-stream logs persistence ────────────────────────────────────
accuracy:
  log_dir: logs/sessions   # where per-stream logs + index.json are written
  retain_sessions: 20      # keep the most recent N streams on disk; prune older
  checkpoint_seconds: 5.0  # min interval between incremental disk checkpoints

# ── Caption processing ────────────────────────────────────────────────────────
caption:
  normalizer:
    max_line_length: 32   # CEA-608 safe-title area standard
    max_lines: 2          # roll-up mode: 2 visible rows

  packetizer:
    rollup_rows: 2
    channel: 1
    service: 1            # CEA-708 service 1 = primary English

  packet_log:
    log_608: logs/cea608.jsonl
    log_708: logs/cea708.jsonl
    format: both          # json | hex | both

# ── Output sinks ─────────────────────────────────────────────────────────────
output:
  terminal:
    enabled: true
    show_timestamps: true
    show_backend: true

  webvtt:
    enabled: true
    host: 0.0.0.0
    port: 8765

  packet_log:
    enabled: true
    verbose: false   # if true, print hex dump to terminal as well as log file

# ── Monitoring ────────────────────────────────────────────────────────────────
monitor:
  report_interval: 30   # seconds between periodic latency reports to stderr
  gpu_interval: 0.25    # nvidia-smi poll cadence (s); fast enough to catch ASR bursts
  gpu_avg_window: 5.0   # rolling window (s) for the smoothed GPU duty-cycle average

# ── Auth (Google OAuth2) ──────────────────────────────────────────────────────
auth:
  enabled: false                     # set true once Google credentials are configured
  google_client_id: ""               # from Google Cloud Console → APIs & Services → Credentials
  google_client_secret: ""           # same; use MC_AUTH_CLIENT_SECRET env var in production
  redirect_uri: "http://localhost:8765/auth/callback"
  allowed_emails: []                 # e.g. [alice@example.com, bob@company.com] — empty = allow all
  session_max_age: 86400             # seconds — 24 h
  session_secret: ""                 # generate: python -c "import secrets; print(secrets.token_hex(32))"
                                     # use MC_AUTH_SESSION_SECRET env var in production
  cookie_name: "mc_session"
  cookie_secure: false               # set true when serving over HTTPS
